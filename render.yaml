# Render Blueprint — personal MCP v0 (streamable-http, personal_ping only)
# Dashboard: New > Blueprint > connect this repo, or create Web Service manually with same env.
services:
  - type: web
    name: personal-mcp
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: MCP_TRANSPORT
        value: streamable-http
      - key: MCP_HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MCP_API_KEY
        generateValue: true
